<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>圖片轉檔WebP - 工具箱</title>
  <link rel="stylesheet" href="../fonts/css/all.css">
  <link rel="stylesheet" href="../css/root.css">
  <script src="../js/jquery-3.3.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
  <script src="../js/main.js"></script>
  <style>
    body {
      box-sizing: border-box;
    }

    .card {
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      width: 90%;
      max-width: 500px;
      text-align: center;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: min(15px,3.5vw);
    }

    #drop-zone {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 40px 20px;
      cursor: pointer;
      background: var(--drop-bg);
      /* margin: 20px 0; */
      transition: 0.3s;
    }

    #drop-zone.hover {
      border-color: var(--primary);
      background: #3b82f61a;
    }

    .controls {
      /* margin: 20px 0; */
      background: var(--drop-bg);
      padding: 15px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="range"] {
      flex: 1;
      min-width: 0;
    }

    .controls label {
      flex-shrink: 0;
      white-space: nowrap;
    }

    #qualityValue {
      font-weight: bold;
      color: var(--primary);
      flex-shrink: 0;
      white-space: nowrap;
    }

    #qNum {
      width: 52px;
      text-align: right;
      font-size: 14px;
      font-weight: bold;
      padding: 2px 4px;
      margin-right: 2px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card-bg);
      color: var(--text-main);
    }

    .file-list {
      /* margin-top: 15px; */
      text-align: left;
      max-height: 180px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      display: none;
    }

    .file-item {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .file-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1 1 140px;
      min-width: 0;
    }

    .file-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .dl-btn,
    .del-btn {
      width: auto;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: normal;
      border-radius: 6px;
    }

    .del-btn {
      background: transparent;
      color: #888;
      border: 1px solid var(--border);
    }

    .file-size {
      font-size: 11px;
      color: var(--text-dim, #888);
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: 0.2s;
    }

    button:disabled {
      opacity: 0.5;
    }

    .status-tag {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #eee;
      color: #666;
    }

    .heic-tag {
      background: #fff3cd;
      color: #856404;
    }

    .container > h2 + p {
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

<div class="container">
  <h2 style="margin-top: 0; margin-left: 0; margin-right: 0;">萬用圖片轉 WebP</h2>
  <p style="font-size: 14px; color: #888; margin-bottom: 20px;">支援 PNG, JPG, HEIC 轉 WebP</p>
  <div class="card">
    <div id="drop-zone">
      <p>拖曳圖片至此，或點擊選擇</p>
      <p style="font-size: 12px; color: var(--text-dim); margin-top: 5px;">(支援 iPhone HEIC 格式)</p>
      <input type="file" id="fileInput" multiple accept="image/*,.heic,.HEIC" style="display: none;">
    </div>

    <div class="controls">
      <label for="quality" style="font-size: 14px;">品質</label>
      <input type="range" id="quality" min="0.1" max="1.0" step="0.01" value="0.85">
      <span id="qualityValue"><input type="number" id="qNum" min="10" max="100" step="1" value="85" aria-label="壓縮品質百分比">%</span>
    </div>

    <div class="file-list" id="fileList"></div>
    <button id="convertBtn" disabled>開始轉檔並下載 ZIP</button>
    <canvas id="canvas" style="display: none;"></canvas>
  </div>
</div>

<script>
  // --- 格式化檔案大小的輔助函式 ---
  function formatBytes(bytes) {
    if (bytes === 0) return '0 B';
    const k = 1024;
    const sizes = ['B', 'KB', 'MB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
  }

  // --- 取得當日日期格式 (YYYYMMDD) ---
  function getFormattedDate() {
    const d = new Date();
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${year}${month}${day}`;
  }

  // --- 取得當下小時 (HH) ---
  function getFormattedHour() {
    return String(new Date().getHours()).padStart(2, '0');
  }

  // --- 轉檔邏輯 ---
  const fileInput = document.getElementById('fileInput');
  const dropZone = document.getElementById('drop-zone');
  const fileList = document.getElementById('fileList');
  const convertBtn = document.getElementById('convertBtn');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  // entries: { file, isHeic, source, blob, done, failed }
  let entries = [];
  let runToken = 0;
  let qTimer = null;

  dropZone.onclick = () => fileInput.click();
  fileInput.onchange = (e) => handleFiles(e.target.files);
  dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('hover'); };
  dropZone.ondragleave = () => dropZone.classList.remove('hover');
  dropZone.ondrop = (e) => { e.preventDefault(); dropZone.classList.remove('hover'); handleFiles(e.dataTransfer.files); };

  function handleFiles(files) {
    const picked = Array.from(files);
    if (picked.length === 0) return;

    entries = picked.map(f => ({
      file: f,
      isHeic: f.name.toLowerCase().endsWith('.heic'),
      source: null, blob: null, done: false, failed: false, q: null
    }));

    renderList();
    estimateAll();
  }

  // 依 entries 重新產生整份清單（刪除後索引會變動，所以整份重畫）
  function renderList() {
    if (entries.length === 0) {
      fileList.innerHTML = '';
      fileList.style.display = 'none';
      convertBtn.disabled = true;
      return;
    }

    fileList.innerHTML = entries.map((en, index) => {
      return `<div class="file-item" data-index="${index}">
                <div class="file-info">
                  <span class="file-name">${en.file.name}</span>
                  <span class="file-size" id="size-${index}">原始 ${formatBytes(en.file.size)} → ${en.isHeic ? '轉檔後計算' : '計算中…'}</span>
                </div>
                <div class="file-right">
                  <span class="status-tag ${en.isHeic ? 'heic-tag' : ''}" id="status-${index}">${en.isHeic ? 'HEIC 待轉換' : '待處理'}</span>
                  <button class="dl-btn" data-index="${index}">下載</button>
                  <button class="del-btn" data-index="${index}" title="從清單移除" aria-label="從清單移除"><i class="fa-solid fa-trash-can"></i></button>
                </div>
            </div>`;
    }).join('');
    fileList.style.display = 'block';
    convertBtn.disabled = false;

    // 重畫後把既有狀態補回去
    entries.forEach((en, i) => {
      if (en.failed) markStatus(i, '失敗', '#f8d7da', '#842029');
      else if (en.done) markStatus(i, '已轉 WebP', '#d1e7dd', '#0f5132');
      renderSize(i, en);
    });
  }

  // --- 滑桿 / 數字框雙向連動 ---
  const qInput = document.getElementById('quality');
  const qNum = document.getElementById('qNum');

  // 以數字框為準
  function getQuality() {
    let v = Math.round(Number(qNum.value));
    if (!Number.isFinite(v)) v = 85;
    return Math.min(100, Math.max(10, v)) / 100;
  }

  function scheduleEstimate() {
    clearTimeout(qTimer);
    qTimer = setTimeout(estimateAll, 300);
  }

  qInput.oninput = () => {
    qNum.value = Math.round(qInput.value * 100);
    scheduleEstimate();
  };

  // 輸入途中只接受 10~100 的有效值，離開欄位時再強制修正
  qNum.oninput = () => {
    const v = Number(qNum.value);
    if (!Number.isFinite(v) || v < 10 || v > 100) return;
    qInput.value = v / 100;
    scheduleEstimate();
  };

  qNum.onchange = () => {
    let v = Math.round(Number(qNum.value));
    if (!Number.isFinite(v)) v = Math.round(qInput.value * 100);
    v = Math.min(100, Math.max(10, v));
    qNum.value = v;
    qInput.value = v / 100;
    scheduleEstimate();
  };

  // --- 單一檔案轉 WebP（HEIC 先解成 JPEG，解過就快取起來）---
  async function convertEntry(en, quality) {
    if (!en.source) {
      if (en.isHeic) {
        const converted = await heic2any({ blob: en.file, toType: "image/jpeg", quality: 0.95 });
        en.source = Array.isArray(converted) ? converted[0] : converted;
      } else {
        en.source = en.file;
      }
    }

    const img = await createImageBitmap(en.source);
    canvas.width = img.width;
    canvas.height = img.height;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    en.blob = await new Promise(res => canvas.toBlob(res, 'image/webp', quality));
    en.q = quality;
    img.close();
    return en.blob;
  }

  function renderSize(i, en) {
    const el = document.getElementById(`size-${i}`);
    if (!el) return;
    const head = `原始 ${formatBytes(en.file.size)} → `;
    if (en.failed) { el.innerText = head + '轉檔失敗'; return; }
    if (!en.blob) { el.innerText = head + (en.isHeic ? '轉檔後計算' : '計算中…'); return; }
    const ratio = Math.round((1 - en.blob.size / en.file.size) * 100);
    el.innerText = `${head}${en.done ? '實際' : '預計'} ${formatBytes(en.blob.size)} (${ratio < 0 ? '+' : '-'}${Math.abs(ratio)}%)`;
  }

  // --- 以目前品質實際轉一次，取得精準的預計大小（HEIC 除外，解碼太慢）---
  async function estimateAll() {
    if (entries.length === 0) return;
    const token = ++runToken;

    for (let i = 0; i < entries.length; i++) {
      const en = entries[i];
      if (en.isHeic && !en.source) continue; // 尚未解過的 HEIC 不預估
      if (en.blob && en.q === getQuality()) { renderSize(i, en); continue; }  // 這個品質已經算過
      en.done = false;
      try {
        await convertEntry(en, getQuality());
        en.failed = false;
      } catch (err) {
        console.error("預估失敗:", en.file.name, err);
        en.failed = true;
      }
      if (token !== runToken) return;
      renderSize(i, en);
    }
  }

  fileList.onclick = async (e) => {
    // 從清單移除（轉檔進行中不開放）
    const del = e.target.closest('.del-btn');
    if (del) {
      if (convertBtn.disabled) return;
      entries.splice(Number(del.dataset.index), 1);
      runToken++;               // 中止進行中的預估，避免索引對不上
      renderList();
      estimateAll();
      return;
    }

    // --- 單張下載：已轉好就直接存，沒轉好就當場轉這一張 ---
    const btn = e.target.closest('.dl-btn');
    if (!btn) return;
    const i = Number(btn.dataset.index);
    const en = entries[i];
    if (!en) return;

    if (!en.blob) {
      btn.disabled = true;
      btn.innerText = '處理中';
      try {
        await convertEntry(en, getQuality());
        en.failed = false;
      } catch (err) {
        console.error("檔案處理失敗:", en.file.name, err);
        en.failed = true;
      }
      btn.disabled = false;
      btn.innerText = '下載';
      renderSize(i, en);
      if (en.failed) { markStatus(i, '失敗', '#f8d7da', '#842029'); return; }
    }

    const link = document.createElement('a');
    link.href = URL.createObjectURL(en.blob);
    link.download = en.file.name.replace(/\.[^/.]+$/, "") + ".webp";
    link.click();
    URL.revokeObjectURL(link.href);
  };

  function markStatus(i, text, bg, color) {
    const tag = document.getElementById(`status-${i}`);
    if (!tag) return;
    tag.innerText = text;
    tag.style.background = bg;
    tag.style.color = color;
  }

  convertBtn.onclick = async () => {
    convertBtn.innerText = '正在處理 (HEIC 可能較慢)...';
    convertBtn.disabled = true;
    const zip = new JSZip();
    const quality = getQuality();
    const token = ++runToken;
    let totalOrigin = 0, totalWebp = 0;

    for (let i = 0; i < entries.length; i++) {
        const en = entries[i];

        try {
            await convertEntry(en, quality);
            en.failed = false;
            en.done = true;

            zip.file(en.file.name.replace(/\.[^/.]+$/, "") + ".webp", en.blob);
            totalOrigin += en.file.size;
            totalWebp += en.blob.size;

            // 即時更新清單中轉檔後的檔案大小與成功狀態
            renderSize(i, en);
            markStatus(i, '已轉 WebP', '#d1e7dd', '#0f5132');
        } catch (err) {
            console.error("檔案處理失敗:", en.file.name, err);
            en.failed = true;
            renderSize(i, en);
            markStatus(i, '失敗', '#f8d7da', '#842029');
        }
        if (token !== runToken) break;
    }

    const content = await zip.generateAsync({ type: "blob" });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(content);

    // 下載檔名：日期 + 時 + 實際縮減率 (例如: webp_20261123_14_-62pct.zip)
    const ratio = totalOrigin > 0 ? Math.round((1 - totalWebp / totalOrigin) * 100) : 0;
    const ratioTag = `${ratio < 0 ? '+' : '-'}${Math.abs(ratio)}pct`;
    link.download = `webp_${getFormattedDate()}_${getFormattedHour()}_${ratioTag}.zip`;
    link.click();
    URL.revokeObjectURL(link.href);

    convertBtn.innerText = '開始轉檔並下載 ZIP';
    convertBtn.disabled = false;
  };
</script>
</body>

</html>
