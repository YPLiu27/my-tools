<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>圖片壓縮工具 - 工具箱</title>
  <script src="../js/jquery-3.3.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <script src="../js/main.js"></script>
  <link rel="stylesheet" href="../fonts/css/all.css">
  <link rel="stylesheet" href="../css/root.css">
  <style>
    .container {
      max-width: 600px;
    }

    .card {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    #drop-zone {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 40px 20px;
      cursor: pointer;
      background: var(--drop-bg);
      margin-bottom: 20px;
      transition: 0.3s;
    }

    #drop-zone:hover {
      border-color: var(--primary);
      background: #3b82f61a;
    }

    .controls {
      background: var(--drop-bg);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    .slider-label {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      margin-bottom: 10px;
    }

    input[type="range"] {
      width: 100%;
      cursor: pointer;
    }

    #qNum {
      width: 56px;
      text-align: right;
      font-size: 14px;
      padding: 2px 4px;
      margin-right: 2px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card-bg);
      color: var(--text-main);
    }

    .file-list {
      text-align: left;
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    .file-item {
      padding: 10px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: space-between;
      align-items: center;
    }

    .size-info {
      color: #888;
      font-size: 11px;
    }

    .file-name {
      flex: 1 1 140px;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-right: 10px;
    }

    .file-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .dl-btn,
    .del-btn {
      width: auto;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: normal;
      border-radius: 6px;
    }

    .del-btn {
      background: transparent;
      color: #888;
      border: 1px solid var(--border);
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 15px;
      border-radius: 10px;
      width: 100%;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <div class="container">
      <h2><i class="fa-solid fa-minimize"></i> 圖片壓縮工具</h2>
      <p style="font-size: 14px; color: #888; margin-bottom: 20px;">支援 JPG / PNG 批量壓縮</p>

    <div class="card">

      <div id="drop-zone" onclick="document.getElementById('f').click()">
        <p>拖曳圖片至此，或點擊選擇</p>
        <input type="file" id="f" multiple accept="image/jpeg,image/png" hidden>
      </div>

      <div class="controls">
        <div class="slider-label">
          <span>壓縮品質 (Quality)</span>
          <span><input type="number" id="qNum" min="10" max="100" step="5" value="70">%</span>
        </div>
        <input type="range" id="quality" min="0.1" max="1.0" step="0.05" value="0.7">
        <p style="font-size: 11px; color: #888; margin-top: 10px; text-align: left;">提示：數值越低，檔案越小，但畫質會下降。</p>
      </div>

      <div class="file-list" id="fileList"></div>
      <button id="compBtn" disabled>開始壓縮並下載 ZIP</button>
    </div>
  </div>

  <canvas id="canvas" style="display: none;"></canvas>

  <script>
    if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');

    const fInput = document.getElementById('f');
    const qInput = document.getElementById('quality');
    const qNum = document.getElementById('qNum');
    const fileList = document.getElementById('fileList');
    const compBtn = document.getElementById('compBtn');
    // entries: { file, bitmap, blob, done }
    let entries = [];
    let runToken = 0;
    let qTimer = null;

    // 以數字框為準（滑桿 step 為 5%，手動輸入可給任意整數）
    function getQuality() {
      let v = Math.round(Number(qNum.value));
      if (!Number.isFinite(v)) v = 70;
      return Math.min(100, Math.max(10, v)) / 100;
    }

    function formatSize(bytes) {
      return bytes < 1024 * 1024
        ? (bytes / 1024).toFixed(1) + ' KB'
        : (bytes / 1024 / 1024).toFixed(2) + ' MB';
    }

    function today() {
      const d = new Date();
      const p = (n) => String(n).padStart(2, '0');
      return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
    }

    function outName(file) {
      return file.name.replace(/\.[^/.]+$/, "") + "_min.jpg";
    }

    function scheduleEstimate() {
      clearTimeout(qTimer);
      qTimer = setTimeout(estimateAll, 300);
    }

    // 滑桿 → 數字框
    qInput.oninput = (e) => {
      qNum.value = Math.round(e.target.value * 100);
      scheduleEstimate();
    };

    // 數字框 → 滑桿（輸入途中只接受 10~100 的有效值，離開欄位時再強制修正）
    qNum.oninput = () => {
      const v = Number(qNum.value);
      if (!Number.isFinite(v) || v < 10 || v > 100) return;
      qInput.value = v / 100;
      scheduleEstimate();
    };

    qNum.onchange = () => {
      let v = Math.round(Number(qNum.value));
      if (!Number.isFinite(v)) v = Math.round(qInput.value * 100);
      v = Math.min(100, Math.max(10, v));
      qNum.value = v;
      qInput.value = v / 100;
      scheduleEstimate();
    };

    fInput.onchange = (e) => handleFiles(e.target.files);

    // 拖曳處理
    const dz = document.getElementById('drop-zone');
    dz.ondragover = (e) => { e.preventDefault(); dz.style.borderColor = "#3b82f6"; };
    dz.ondragleave = () => dz.style.borderColor = "";
    dz.ondrop = (e) => { e.preventDefault(); dz.style.borderColor = ""; handleFiles(e.dataTransfer.files); };

    function handleFiles(files) {
      const picked = Array.from(files).filter(f => f.type.match('image.*'));
      if (picked.length === 0) return;

      entries = picked.map(f => ({ file: f, bitmap: null, blob: null, done: false, q: null }));
      renderList();
      estimateAll();
    }

    // 依 entries 重新產生整份清單（刪除後索引會變動，所以整份重畫）
    function renderList() {
      if (entries.length === 0) {
        fileList.innerHTML = '';
        fileList.style.display = 'none';
        compBtn.disabled = true;
        return;
      }

      fileList.innerHTML = entries.map((en, i) => `
                <div class="file-item">
                    <span class="file-name">${en.file.name}</span>
                    <span class="file-right">
                        <span class="size-info" id="size-${i}">${formatSize(en.file.size)} → 計算中…</span>
                        <button class="dl-btn" data-i="${i}">下載</button>
                        <button class="del-btn" data-i="${i}" title="從清單移除" aria-label="從清單移除"><i class="fa-solid fa-trash-can"></i></button>
                    </span>
                </div>
            `).join('');
      fileList.style.display = 'block';
      compBtn.disabled = false;
      entries.forEach((en, i) => { if (en.blob) renderSize(i, en); });
    }

    fileList.onclick = async (e) => {
      // 從清單移除（壓縮進行中不開放）
      const del = e.target.closest('.del-btn');
      if (del) {
        if (compBtn.disabled) return;
        const en = entries[Number(del.dataset.i)];
        if (en && en.bitmap) en.bitmap.close();
        entries.splice(Number(del.dataset.i), 1);
        runToken++;               // 中止進行中的預估，避免索引對不上
        renderList();
        estimateAll();
        return;
      }

      // 點單張下載：已算好就直接下載，還沒算好就當場壓這一張
      const btn = e.target.closest('.dl-btn');
      if (!btn) return;
      const en = entries[Number(btn.dataset.i)];
      if (!en) return;

      if (!en.blob) {
        btn.disabled = true;
        btn.innerText = '處理中';
        await compressEntry(en, getQuality());
        btn.disabled = false;
        btn.innerText = '下載';
      }
      const link = document.createElement('a');
      link.href = URL.createObjectURL(en.blob);
      link.download = outName(en.file);
      link.click();
      URL.revokeObjectURL(link.href);
    };

    // 壓縮邏輯：統一轉為 jpeg 輸出以達到壓縮效果
    // 如果是 PNG 且想保持透明度，壓縮率通常不高，故此工具優先以體積優化為主
    async function compressEntry(en, quality) {
      if (!en.bitmap) en.bitmap = await createImageBitmap(en.file);
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = en.bitmap.width;
      canvas.height = en.bitmap.height;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(en.bitmap, 0, 0);
      en.blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', quality));
      en.q = quality;
      return en.blob;
    }

    function renderSize(i, en) {
      const el = document.getElementById('size-' + i);
      if (!el) return;
      const label = en.done ? '實際' : '預計';
      const ratio = Math.round((1 - en.blob.size / en.file.size) * 100);
      el.innerText = `${formatSize(en.file.size)} → ${label} ${formatSize(en.blob.size)} (${ratio > 0 ? '-' : '+'}${Math.abs(ratio)}%)`;
    }

    // 以目前品質實際壓一次，取得精準的預計大小
    async function estimateAll() {
      if (entries.length === 0) return;
      const token = ++runToken;
      const quality = getQuality();

      for (let i = 0; i < entries.length; i++) {
        const en = entries[i];
        if (en.blob && en.q === quality) { renderSize(i, en); continue; }  // 這個品質已經算過
        en.done = false;
        await compressEntry(en, quality);
        if (token !== runToken) return;
        renderSize(i, en);
      }
    }

    compBtn.onclick = async () => {
      compBtn.innerText = '壓縮中...';
      compBtn.disabled = true;

      const token = ++runToken;
      const quality = getQuality();
      const zip = new JSZip();

      for (let i = 0; i < entries.length; i++) {
        const en = entries[i];
        await compressEntry(en, quality);
        if (token !== runToken) break;
        en.done = true;
        renderSize(i, en);
        zip.file(outName(en.file), en.blob);
      }

      const content = await zip.generateAsync({ type: "blob" });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(content);
      link.download = `compressed_q${Math.round(quality * 100)}_${today()}.zip`;
      link.click();
      URL.revokeObjectURL(link.href);

      compBtn.innerText = '開始壓縮並下載 ZIP';
      compBtn.disabled = false;
    };
  </script>
</body>

</html>
